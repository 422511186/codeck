services:
  codex-web:
    image: codex-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${CODEX_WEB_DOCKER_NODE_IMAGE:-node:22-bookworm-slim}
    container_name: codex-web-19899
    restart: unless-stopped
    init: true
    mem_limit: ${CODEX_WEB_MEMORY_LIMIT:-2g}
    memswap_limit: ${CODEX_WEB_MEMORY_SWAP_LIMIT:-2g}
    cpus: "${CODEX_WEB_CPU_LIMIT:-2.0}"
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CODEX_WEB_BIND_PORT: "19899"
      CODEX_WEB_APP_SERVER_MODE: external
      CODEX_WEB_APP_SERVER_URL: ws://127.0.0.1:31318
      CODEX_WEB_UPLOAD_DIR: /home/hzy/workspace/codex-web-phone/uploads
      CODEX_WEB_AUDIT_LOG_PATH: /home/hzy/workspace/codex-web-phone/logs/audit.jsonl
    volumes:
      - type: bind
        source: /home/hzy/workspace
        target: /home/hzy/workspace
      - type: bind
        source: /home/hzy/workspace/codex-web-phone/uploads
        target: /home/hzy/workspace/codex-web-phone/uploads
      - type: bind
        source: /home/hzy/workspace/codex-web-phone/logs
        target: /home/hzy/workspace/codex-web-phone/logs
